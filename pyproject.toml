[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratiss-qvm"
version = "0.2.0"
description = "Ordinateur quantique virtuel RATISS : univers 300q (trous noirs+gravite) + jumeaux IBM + outils NV"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "qiskit>=1.0", "qiskit-aer>=0.14", "matplotlib>=3.6", "pillow>=9"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=7"]
qsim = ["qsimcirq"]

[tool.setuptools.packages.find]
include = ["rqvm*", "ratiss_qpu*"]
